name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      project_url:
        description: "URL do ZIP do projeto gerado pelo Andreo"
        required: true
        type: string
      artifact_name:
        description: "Nome do artefato"
        required: false
        default: "andreo-windows"
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar projeto do Andreo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force project | Out-Null
          Invoke-WebRequest -Uri "${{ inputs.project_url }}" -OutFile project/source.zip
          Expand-Archive -Path project/source.zip -DestinationPath project/source -Force

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: project/source/package-lock.json

      - name: Instalar dependências
        working-directory: project/source
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } elseif (Test-Path package.json) { npm install }

      - name: Compilar EXE
        working-directory: project/source
        shell: pwsh
        run: |
          if (Test-Path package.json) {
            $package = Get-Content package.json | ConvertFrom-Json
            if ($package.scripts.'build:win') { npm run build:win }
            elseif ($package.scripts.dist) { npm run dist -- --win }
            else { throw "O package.json não possui build:win ou dist." }
          } else { throw "O pacote não contém package.json para build Windows." }

      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            project/source/dist/**/*.exe
            project/source/release/**/*.exe
          if-no-files-found: error
