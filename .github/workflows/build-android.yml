name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      project_url:
        description: "URL do ZIP do projeto gerado pelo Andreo"
        required: true
        type: string
      artifact_name:
        description: "Nome do artefato"
        required: false
        default: "andreo-android"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto do Andreo
        shell: bash
        run: |
          mkdir -p project
          curl -fL "${{ inputs.project_url }}" -o project/source.zip
          unzip -q project/source.zip -d project/source

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Preparar Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "$ANDROID_HOME" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "Android SDK não encontrado no runner."
            exit 1
          fi

      - name: Compilar APK debug
        working-directory: project/source
        shell: bash
        run: |
          if command -v gradle >/dev/null 2>&1; then
            gradle assembleDebug --no-daemon
          elif [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "O pacote não contém um projeto Gradle Android compilável."
            exit 1
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: project/source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
